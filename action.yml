name: "KAERIS i18n Check and Translate"
description: "Fail CI on missing keys or broken placeholders in locale files, or translate new keys into 46 languages. 13 formats."
branding:
  icon: check-circle
  color: gray-dark

inputs:
  mode:
    description: "translate (write/update locale files) or check (i18n firewall — no API call, fails if incomplete/broken)."
    required: false
    default: "translate"
  source:
    description: "Source strings file (e.g. locales/en.json)"
    required: true
  languages:
    description: "Comma-separated target languages, e.g. es,fr,de,ja"
    required: true
  out:
    description: "Directory for translated files / where target locale files live (default: source's directory)"
    required: false
    default: ""
  api-key:
    description: "KAERIS API key, e.g. the free key from kaeris.dev/docs/key (no account). Omit for the free demo. Unused in check mode."
    required: false
    default: ""
  openrouter-key:
    description: "OpenRouter key for Lifetime/BYOK plans. Unused in check mode."
    required: false
    default: ""
  only-new:
    description: "translate mode: only translate keys missing/changed since the last run (JSON, uses kaeris.lock)."
    required: false
    default: "true"
  tone:
    description: "translate mode: tone of voice — neutral, formal, or casual."
    required: false
    default: ""
  icu:
    description: "translate mode: hint that source strings use ICU MessageFormat (plurals/select) so it's preserved."
    required: false
    default: "false"
  sarif-file:
    description: >-
      check mode: also write a SARIF 2.1.0 report here. Upload it with
      github/codeql-action/upload-sarif and every finding becomes an annotation on the exact
      line of the locale file, inside the pull request. Empty (default) writes nothing.
    required: false
    default: ""

  strict:
    description: "check mode: also fail on warnings and if a target locale has extra/stale keys not in the source."
    required: false
    default: "false"
  comment:
    description: >-
      check mode, on pull_request: keep one PR comment with the findings (file, key, language,
      problem), edited on every push. Posted only when the check fails; a later run edits it to
      what is left ("no problems", or "nothing to fix, 2 warnings"), or to "did not finish" when
      `kaeris check` exits 2 or crashes without a result. Needs `permissions: pull-requests: write`; without it (and on a PR
      from a fork) there is no comment, a failing run gets one warning, the findings are in the
      job summary and the result is unchanged. Its last line links kaeris.dev unless
      `cta: false`. "false" turns the comment off.
    required: false
    default: "true"
  comment-key:
    description: >-
      check mode: which comment this check keeps. Default: derived from source, out and
      languages, so two checks (a language matrix, two steps) keep two comments. Set it to tell
      apart two checks over the same files.
    required: false
    default: ""
  comment-author:
    description: >-
      check mode: the login the token posts as; only its comments are ever edited. Default:
      github-actions[bot] for the GITHUB_TOKEN; for a PAT it is read from GET /user. An App token
      cannot say who it is: set it (e.g. my-app[bot]), the job warns with the login to use.
    required: false
    default: ""
  github-token:
    description: "Token for the PR comment, used in that step only. The default is the workflow's own GITHUB_TOKEN."
    required: false
    default: ${{ github.token }}
  cta:
    description: "Link kaeris.dev on the last line of the summary and the PR comment. \"false\" leaves it out."
    required: false
    default: "true"
  api-url:
    description: "API base URL."
    required: false
    default: "https://kaeris.dev"

outputs:
  changed:
    description: "\"true\" if translate mode wrote/updated any locale (or lockfile) content — open a PR only when this is true."
    value: ${{ steps.run.outputs.changed }}
  summary:
    description: "Markdown summary: keys translated, per-language matrix, placeholder-loss and overflow counts — use as a PR body/comment."
    value: ${{ steps.run.outputs.summary }}
  missing:
    description: "Total missing-key count across all target languages, from the post-run `kaeris check --json`."
    value: ${{ steps.run.outputs.missing }}
  placeholder-issues:
    description: "Total placeholder-mismatch count across all target languages (should be 0)."
    value: ${{ steps.run.outputs.placeholder-issues }}
  check-exit-code:
    description: "Exit code of the post-run `kaeris check` (0 clean, 1 problem found, 2 bad usage)."
    value: ${{ steps.run.outputs.check-exit-code }}
  translate-exit-code:
    description: "Exit code of `kaeris translate` (0 clean, 3 some languages fell back to source). Non-zero also fails the step."
    value: ${{ steps.run.outputs.translate-exit-code }}
  comment-url:
    description: "check mode: URL of the PR comment this run posted or edited; empty when none."
    value: ${{ steps.comment.outputs.comment-url }}

runs:
  using: composite
  steps:
    - name: Set up Python
      # v6 runs on Node 24. v5 targets Node 20, which GitHub deprecated: every job using this
      # action got a "Node.js 20 is deprecated … actions/setup-python@v5" warning. A self-hosted
      # runner needs v2.327.1 or later.
      uses: actions/setup-python@v6
      with:
        python-version: "3.x"

    - name: Install KAERIS CLI
      shell: bash
      # Pin to the version that ships every flag this action passes — the `check --json --ci`
      # firewall, the incremental flags, and `--sarif`. Unpinned, a runner can be handed an
      # older CLI that lacks one and the job dies on "unrecognized arguments": that is exactly
      # how the SARIF gap showed up by hand on 03.08.2026. v2 starts from 0.2.39, the release
      # current when v2 was cut.
      run: pip install "kaeris>=0.2.39"

    - name: Run KAERIS (${{ inputs.mode }})
      id: run
      shell: bash
      env:
        KAERIS_API_KEY: ${{ inputs.api-key }}
        KAERIS_OPENROUTER_KEY: ${{ inputs.openrouter-key }}
        KAERIS_API_URL: ${{ inputs.api-url }}
        KA_MODE: ${{ inputs.mode }}
        KA_SOURCE: ${{ inputs.source }}
        KA_LANGS: ${{ inputs.languages }}
        KA_OUT: ${{ inputs.out }}
        KA_ONLY_NEW: ${{ inputs.only-new }}
        KA_TONE: ${{ inputs.tone }}
        KA_ICU: ${{ inputs.icu }}
        KA_STRICT: ${{ inputs.strict }}
        KA_SARIF: ${{ inputs.sarif-file }}
        KA_CTA: ${{ inputs.cta }}
      # No GitHub token here: this step runs the CLI and summarize.py, neither needs one, and a
      # token with pull-requests: write has no business in their environment.
      run: |
        set -e
        # GitHub's `if:` compares strings ignoring case, bash does not: `mode: Check` used to be
        # translate here and check in an `if:`. One reading, made here and handed to the later
        # steps as is-check; anything that is not a mode stops before the CLI runs.
        mode="$(printf '%s' "$KA_MODE" | tr '[:upper:]' '[:lower:]')"
        case "$mode" in
          check|translate) ;;
          *)
            echo "::error::mode must be check or translate (got \"$KA_MODE\")"
            echo "is-check=false" >> "$GITHUB_OUTPUT"
            exit 2
            ;;
        esac
        if [ "$mode" = "check" ]; then
          echo "is-check=true" >> "$GITHUB_OUTPUT"
        else
          echo "is-check=false" >> "$GITHUB_OUTPUT"
        fi
        out="$KA_OUT"
        [ -z "$out" ] && out="$(dirname "$KA_SOURCE")"
        strict_flag=()
        [ "$KA_STRICT" = "true" ] && strict_flag+=(--strict)

        before_json="$RUNNER_TEMP/kaeris-check-before.json"
        after_json="$RUNNER_TEMP/kaeris-check-after.json"
        translate_log="$RUNNER_TEMP/kaeris-translate.log"
        summary_file="$RUNNER_TEMP/kaeris-summary.md"
        changed=false

        # Clear any scratch files left by a prior invocation of this action earlier in the same
        # job (e.g. a translate step followed by a check step sharing $RUNNER_TEMP) — otherwise a
        # stale "before" snapshot could leak into this run's translated-key count.
        # SARIF is always written in check mode: it is where the CLI says which file each language
        # lives in, and the PR comment needs that for its File column. Without `sarif-file` it goes
        # to a scratch path nobody uploads.
        sarif_out="$KA_SARIF"
        if [ -z "$sarif_out" ]; then
          sarif_out="$RUNNER_TEMP/kaeris-check.sarif"
          rm -f "$sarif_out"
        fi
        rm -f "$before_json" "$after_json" "$translate_log" "$summary_file"

        if [ "$mode" = "check" ]; then
          # The i18n firewall: static, no API call. Result captured to JSON; exit code decides the gate below.
          set +e
          kaeris check --source "$KA_SOURCE" --langs "$KA_LANGS" --out "$out" --ci "${strict_flag[@]}" --sarif "$sarif_out" --json > "$after_json"
          check_exit=$?
          set -e
        else
          # Baseline ("before") snapshot for an honest "N keys translated" count — best-effort;
          # e.g. the very first run with no target files yet still produces valid JSON.
          kaeris check --source "$KA_SOURCE" --langs "$KA_LANGS" --out "$out" --json > "$before_json" 2>/dev/null || true

          args=(translate "$KA_SOURCE" --langs "$KA_LANGS" --out "$out")
          [ "$KA_ONLY_NEW" = "true" ] && args+=(--only-new)
          [ -n "$KA_TONE" ] && args+=(--tone "$KA_TONE")
          [ "$KA_ICU" = "true" ] && args+=(--icu)
          # `set -e` does NOT catch this: a pipeline's status is the status of its LAST
          # command, and `tee` always succeeds. So every non-zero exit from `kaeris translate`
          # was swallowed and the action carried on as if the run had gone fine — including
          # exit 3, "some languages fell back to untranslated source text". The customer's
          # workflow then opened a PR with English sitting in de.json, green tick and all.
          # `kaeris check` does not save us here either: a fallen-back string is present and
          # structurally identical to the source, so it is a YELLOW warning, not a failure.
          set +e
          kaeris "${args[@]}" 2>&1 | tee "$translate_log"
          translate_exit=${PIPESTATUS[0]}
          set -e

          set +e
          kaeris check --source "$KA_SOURCE" --langs "$KA_LANGS" --out "$out" --json > "$after_json"
          check_exit=$?
          set -e

          if [ -n "$(git status --porcelain -- "$out" 2>/dev/null)" ]; then
            changed=true
          fi
        fi

        # Build the markdown summary + all outputs (missing/placeholder-issues/summary) from the
        # real `kaeris check --json` result (and, in translate mode, the translate log for overflow
        # QA) — never fabricated. `changed` and `check-exit-code` are appended by this script below.
        [ "$KA_CTA" = "false" ] && export KAERIS_NO_CTA=1
        python3 "${{ github.action_path }}/summarize.py" \
          --mode "$mode" \
          --langs "$KA_LANGS" \
          --after "$after_json" \
          --before "$before_json" \
          --log "$translate_log" \
          --check-exit "$check_exit" \
          --out-file "$summary_file" \
          --github-output "$GITHUB_OUTPUT"

        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
        fi
        cat "$summary_file"

        {
          echo "changed=$changed"
          echo "check-exit-code=$check_exit"
          echo "translate-exit-code=${translate_exit:-0}"
          echo "check-json=$after_json"
          echo "sarif=$sarif_out"
        } >> "$GITHUB_OUTPUT"

        # Fail the job on a bad translate run — but only AFTER the summary above is written,
        # so whoever opens the run sees exactly which languages did not make it.
        if [ "$mode" != "check" ] && [ "${translate_exit:-0}" != "0" ]; then
          if [ "${translate_exit}" = "3" ]; then
            echo "::error::Some languages fell back to untranslated source text and were NOT translated — see the log above. Do not merge these locale files."
          else
            echo "::error::kaeris translate failed (exit ${translate_exit}) — see the log above."
          fi
          exit "$translate_exit"
        fi

    # One PR comment with the findings, edited on every push, and the full list in the job
    # summary. Its own step so the token reaches nothing else. It never decides the job:
    # pr_comment.py exits 0 on any failure, `|| echo` covers a crash, and the gate is the next step.
    - name: PR comment
      id: comment
      if: steps.run.outputs.is-check == 'true'
      shell: bash
      env:
        KA_COMMENT: ${{ inputs.comment }}
        KA_COMMENT_KEY: ${{ inputs.comment-key }}
        KA_COMMENT_AUTHOR: ${{ inputs.comment-author }}
        KA_GITHUB_TOKEN: ${{ inputs.github-token }}
        # "true" when github-token is the workflow's own token: then we post as
        # github-actions[bot] and GET /user is pointless (it is 403 for that token).
        KA_TOKEN_IS_DEFAULT: ${{ inputs.github-token == github.token }}
        KA_CTA: ${{ inputs.cta }}
        KA_SOURCE: ${{ inputs.source }}
        KA_LANGS: ${{ inputs.languages }}
        KA_OUT: ${{ inputs.out }}
        KA_STRICT: ${{ inputs.strict }}
        KA_CHECK_JSON: ${{ steps.run.outputs.check-json }}
        KA_SARIF_PATH: ${{ steps.run.outputs.sarif }}
        KA_CHECK_EXIT: ${{ steps.run.outputs.check-exit-code }}
      run: |
        python3 "${{ github.action_path }}/pr_comment.py" \
          --check-json "$KA_CHECK_JSON" \
          --check-exit "$KA_CHECK_EXIT" \
          --sarif "$KA_SARIF_PATH" \
          --source "$KA_SOURCE" \
          --langs "$KA_LANGS" \
          --out "$KA_OUT" \
          --strict "$KA_STRICT" \
          --summary-file "${GITHUB_STEP_SUMMARY:-}" \
          --github-output "$GITHUB_OUTPUT" \
          || echo "::warning title=KAERIS PR comment::The PR comment step crashed; the check result still decides the job."

    - name: Gate on kaeris check
      if: steps.run.outputs.is-check == 'true'
      shell: bash
      env:
        KA_CHECK_EXIT: ${{ steps.run.outputs.check-exit-code }}
        KA_CHECK_JSON: ${{ steps.run.outputs.check-json }}
      run: |
        # 1 is the CLI's "found something"; anything else (2 bad usage, a crash) is not about
        # the translations and must not be reported as if it were. A crash is exit 1 too, but
        # with nothing on stdout: no result, so not "found".
        if [ "$KA_CHECK_EXIT" = "1" ] && [ ! -s "$KA_CHECK_JSON" ]; then
          echo "::error::kaeris check failed (exit 1) without a result, see the log above"
          exit 1
        elif [ "$KA_CHECK_EXIT" = "1" ]; then
          echo "::error::kaeris check found incomplete/broken translations — see the job summary for the language matrix"
          exit 1
        elif [ "$KA_CHECK_EXIT" != "0" ]; then
          echo "::error::kaeris check failed (exit ${KA_CHECK_EXIT:-unknown}), see the log above"
          exit "${KA_CHECK_EXIT:-1}"
        fi
